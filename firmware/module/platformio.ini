; Drawer module firmware (CH32V003F4P6), flashed through a WCH-LinkE on SWIO.
;
; Default environment: flashes with wlink, which works with the stock WCH
; driver on Windows. The plain "pio run -t upload" (and the VS Code upload
; button) use this one.
[platformio]
default_envs = module

[env:module]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = ch32v003fun
upload_protocol = wlink
; Shared protocol header lives outside this project.
build_flags = -I../common

; Alternative flasher. minichlink needs the WCH-LinkE to be switched to the
; WinUSB driver (Zadig) on Windows, otherwise it fails with libusb_open() = -5.
;   pio run -e module_minichlink -t upload
[env:module_minichlink]
extends = env:module
upload_protocol = minichlink
