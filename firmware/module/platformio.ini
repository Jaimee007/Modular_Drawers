; Drawer module firmware (CH32V003F4P6), flashed through a WCH-LinkE on SWIO.
;
; One environment per bench program. The environment name is also the source
; file name (src/<env>.c) and the section name in docs/07_pruebas_banco.md.
; Naming: phaseN_<function> for the module, matching docs/plan_firmware.md.
;
; Default environment: flashes with wlink, which works with the stock WCH
; driver on Windows. The plain "pio run -t upload" (and the VS Code upload
; button) use this one.
[platformio]
default_envs = phase3_bus_tx

[env:phase3_bus_tx]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = ch32v003fun
upload_protocol = wlink
; Shared protocol header lives outside this project.
build_flags = -I../common
; src/ holds several programs, each with its own main(); each env builds one.
build_src_filter = -<*> +<phase3_bus_tx.c>

; Phase 2 bench test (address jumpers, limit switch, SENSE pins), printf only.
;   pio run -e phase2_peripherals -t upload
[env:phase2_peripherals]
extends = env:phase3_bus_tx
build_src_filter = -<*> +<phase2_peripherals.c>

; Bidirectional half-duplex bus: answers PING and GET_STATE (bench test).
;   pio run -e phase3_bus -t upload
[env:phase3_bus]
extends = env:phase3_bus_tx
build_src_filter = -<*> +<phase3_bus.c>

; Alternative flasher. minichlink needs the WCH-LinkE to be switched to the
; WinUSB driver (Zadig) on Windows, otherwise it fails with libusb_open() = -5.
;   pio run -e phase3_bus_tx_minichlink -t upload
[env:phase3_bus_tx_minichlink]
extends = env:phase3_bus_tx
upload_protocol = minichlink
