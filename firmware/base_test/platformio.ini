; Bench-test firmware for the base controller (ESP32-C3 SuperMini).
;
; One environment per bench program. The environment name is also the source
; file name (src/<env>.cpp) and the section name in docs/07_pruebas_banco.md.
; Naming: base_<function>, matching docs/plan_firmware.md.
[platformio]
default_envs = base_bus_rx

[env:base_bus_rx]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The two ARDUINO_USB_* flags route Serial to the SuperMini's USB-C port.
; -I../common pulls in the shared bus.h.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I../common
; src/ holds several programs, each with its own setup()/loop(); each env builds one.
build_src_filter = -<*> +<base_bus_rx.cpp>

; RGB LED + limit switch bench test (3 MOSFETs, PWM, serial commands).
;   pio run -e base_rgb_led -t upload
[env:base_rgb_led]
extends = env:base_bus_rx
build_src_filter = -<*> +<base_rgb_led.cpp>
