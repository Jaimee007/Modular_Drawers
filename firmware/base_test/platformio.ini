; Bench-test firmware for the base controller (ESP32-C3 SuperMini).
[env:base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The two ARDUINO_USB_* flags route Serial to the SuperMini's USB-C port.
; -I../common pulls in the shared bus.h.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I../common
; src/ holds more than one program with its own setup()/loop(); each env picks one.
build_src_filter = +<*> -<led_test.cpp>

; RGB LED + limit switch bench test (3 MOSFETs, PWM, serial commands).
;   pio run -e led_test -t upload
[env:led_test]
extends = env:base
build_src_filter = -<*> +<led_test.cpp>
