; Bench-test firmware for the base controller (ESP32-C3 SuperMini).
[env:base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The two ARDUINO_USB_* flags route Serial to the SuperMini's USB-C port.
; -I../common pulls in the shared bus.h.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I../common
